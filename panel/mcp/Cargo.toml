[package]
name = "dockpanel-mcp"
version = "2.242.0"
license = "AGPL-3.0-only"
edition = "2024"
description = "MCP server exposing read-only DockPanel introspection to AI agents"

[[bin]]
name = "dockpanel-mcp"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
# Pinned >=3.2.0: GHSA-9pj6-vhgr-3mwh (CVSS 7.5, unauthenticated memory-leak DoS
# in handle_post) was fixed in 2.0.0 — never let this drift below 3.2.0 on a
# tutorial's older pin. transport-streamable-http-server is the only non-default
# feature needed; "server" + "macros" (tool_router/tool/tool_handler, Parameters<T>)
# are already on by default.
rmcp = { version = "3.2.0", features = ["transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rmcp 3.2.0's own `schemars` feature pulls in schemars 1.x internally — the
# JsonSchema derive here must be the SAME major version or the #[tool] macro's
# generated schema won't satisfy the trait bound it expects.
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
